name: Build

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - zabbix-agent2
          # - backrest
          # - rooter-statistics
        include:
          - arch: amd64
            platform: linux/amd64
          # Uncomment below when ready to build aarch64 as well:
          # - arch: aarch64
          #   platform: linux/arm64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract add-on version
        id: meta
        run: |
          VERSION=$(jq -r '.version' "${{ matrix.addon }}/config.json")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.addon }} (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.addon }}
          platforms: ${{ matrix.platform }}
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/home-assistant-addon-${{ matrix.arch }}-${{ matrix.addon }}:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/home-assistant-addon-${{ matrix.arch }}-${{ matrix.addon }}:latest
