name: Build

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - zabbix-agent2
          # - backrest
          # - rooter-statistics
        arch:
          - amd64
          # - aarch64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.addon }} (${{ matrix.arch }})
        uses: home-assistant/builder/build-image@main
        with:
          addon: ${{ matrix.addon }}
          arch: ${{ matrix.arch }}
          image: ${{ secrets.DOCKER_USERNAME }}/home-assistant-addon-${{ matrix.arch }}-${{ matrix.addon }}
          push: ${{ github.event_name != 'pull_request' }}
